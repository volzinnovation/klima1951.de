# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # GITHUB_TOKEN pushes from ETL do not trigger another push workflow.
  workflow_run:
    workflows: ["Daily Data Processing"]
    types: [completed]
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    # Only successful, trusted main-branch ETL runs may trigger publication.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       (github.event.workflow_run.event == 'schedule' ||
        github.event.workflow_run.event == 'workflow_dispatch'))
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # For workflow_run this is the default branch tip at completion,
          # including the ETL commit, not the ETL run's older head_sha.
          ref: ${{ github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate status payload
        run: |
          python -m json.tool frontend/data-status.json >/dev/null
          python etl/data_status.py --format json --public > /tmp/data-status.generated.json
          python - <<'PY'
          import json

          with open("frontend/data-status.json", encoding="utf-8") as handle:
              payload = json.load(handle)

          freshness = payload.get("freshness") or {}
          required = {
              "expected_latest_complete_year",
              "stats_latest_complete_year",
              "hyras_latest_complete_year",
              "status",
          }
          missing = sorted(required - set(freshness))
          if missing:
              raise SystemExit(f"Missing freshness fields: {', '.join(missing)}")
          if freshness["status"] != "ok":
              raise SystemExit(f"Published freshness is not OK: {freshness['status']}")
          PY
          test -f frontend/status.html
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          # Upload entire repository
          path: 'frontend'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
